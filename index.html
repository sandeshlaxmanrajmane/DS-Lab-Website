<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Structures Laboratory</title>
  <style>
/* Aesthetic Animated Theme for Data Structures Lab */
:root {
  --bg-deep: #0a0f1d;
  --bg-card: rgba(18, 25, 44, 0.75);
  --bg-card-hover: rgba(26, 36, 62, 0.9);
  --bg-glass: rgba(15, 23, 42, 0.65);
  --border-subtle: rgba(148, 163, 184, 0.12);
  --border-glow: rgba(99, 102, 241, 0.4);
  --accent-cyan: #38bdf8;
  --accent-indigo: #6366f1;
  --accent-purple: #a855f7;
  --accent-pink: #ec4899;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-dim: #64748b;
  --code-bg: #090d16;
  --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-code: "JetBrains Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-main);
  background-color: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  position: relative;
  overflow-x: hidden;
}

/* Ambient dynamic background lighting */
.ambient-glow {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
  background: 
    radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.18), transparent 38%),
    radial-gradient(circle at 85% 25%, rgba(168, 85, 247, 0.15), transparent 42%),
    radial-gradient(circle at 50% 85%, rgba(56, 189, 248, 0.12), transparent 45%);
  filter: blur(40px);
}

.site-wrapper {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px 64px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Navigation Top Bar */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  margin-bottom: 36px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
}

.brand-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}

.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.1rem;
  color: #fff;
  box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
  animation: pulse-glow 3s infinite alternate;
}

.brand-text h1 {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  background: linear-gradient(90deg, #ffffff, #cbd5e1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-text span {
  font-size: 0.75rem;
  color: var(--accent-cyan);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
}

.quick-nav-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.quick-pill {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  justify-content: center;
}

.quick-pill:hover {
  background: rgba(99, 102, 241, 0.2);
  color: #fff;
  border-color: var(--accent-indigo);
  transform: translateY(-2px);
}

.quick-pill.active {
  background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
}

/* VIEW 1: HERO & QUESTION SELECTOR */
.view-selector {
  display: block;
  animation: fadeIn 0.4s ease-out;
}

.hero-section {
  text-align: center;
  margin: 20px 0 48px;
}

.hero-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border-radius: 100px;
  background: rgba(99, 102, 241, 0.12);
  border: 1px solid rgba(99, 102, 241, 0.3);
  color: var(--accent-cyan);
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  margin-bottom: 20px;
}

.hero-pill-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: var(--accent-cyan);
  box-shadow: 0 0 8px var(--accent-cyan);
}

.hero-title {
  font-size: 2.8rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.2;
  margin-bottom: 16px;
}

.gradient-text {
  background: linear-gradient(135deg, #ffffff 30%, #93c5fd 70%, #c084fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-subtitle {
  color: var(--text-secondary);
  font-size: 1.12rem;
  max-width: 650px;
  margin: 0 auto;
}

/* Grid of 1 to 9 Options */
.options-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.option-card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: 20px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 190px;
}

.option-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent-indigo), transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.option-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-glow);
  transform: translateY(-6px);
  box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.25);
}

.option-card:hover::before {
  opacity: 1;
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.card-num-badge {
  font-family: var(--font-code);
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--accent-cyan);
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid rgba(56, 189, 248, 0.2);
  border-radius: 10px;
  padding: 4px 12px;
}

.card-arrow {
  color: var(--text-dim);
  font-size: 1.2rem;
  transition: transform 0.2s ease, color 0.2s ease;
}

.option-card:hover .card-arrow {
  color: #fff;
  transform: translateX(4px);
}

.card-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}

.card-desc {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 18px;
}

.card-footer-tags {
  display: flex;
  gap: 8px;
  margin-top: auto;
}

.sub-tag {
  font-size: 0.76rem;
  font-family: var(--font-code);
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #cbd5e1;
}

/* VIEW 2: ANSWER DETAIL VIEW */
.view-detail {
  display: none;
  animation: slideUp 0.35s ease-out;
}

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-subtle);
  flex-wrap: wrap;
  gap: 16px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.back-btn:hover {
  background: rgba(99, 102, 241, 0.2);
  border-color: var(--accent-indigo);
  transform: translateX(-3px);
  color: #fff;
}

.detail-title-group h2 {
  font-size: 1.85rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #ffffff;
}

.detail-title-group p {
  color: var(--text-secondary);
  font-size: 0.95rem;
}

/* Subquestion Card in Answer View */
.answer-card {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: 20px;
  margin-bottom: 36px;
  overflow: hidden;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  transition: border-color 0.2s ease;
}

.answer-card:hover {
  border-color: rgba(99, 102, 241, 0.3);
}

.answer-header {
  padding: 20px 28px;
  background: linear-gradient(90deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.05));
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.answer-header-title {
  display: flex;
  align-items: center;
  gap: 14px;
}

.badge-subquestion {
  background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
  color: #fff;
  font-weight: 800;
  font-size: 0.95rem;
  padding: 5px 14px;
  border-radius: 8px;
  box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
}

.answer-header-title h3 {
  font-size: 1.25rem;
  font-weight: 700;
  color: #ffffff;
}

.answer-body {
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

/* Section Blocks */
.content-section {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.section-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.88rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent-cyan);
}

.section-tag::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: var(--accent-cyan);
  box-shadow: 0 0 6px var(--accent-cyan);
}

/* 1. Problem Statement */
.question-box {
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 20px 24px;
  color: #e2e8f0;
  font-size: 1rem;
  line-height: 1.7;
}

.question-box p {
  margin-bottom: 12px;
}

.question-box p:last-child {
  margin-bottom: 0;
}

.sample-input-box {
  margin-top: 14px;
  background: #090d16;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-left: 3px solid var(--accent-purple);
  border-radius: 8px;
  padding: 14px 18px;
  font-family: var(--font-code);
  font-size: 0.88rem;
  white-space: pre;
  overflow-x: auto;
  color: #cbd5e1;
}

/* 2. Algorithm */
.algorithm-box {
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 22px 24px;
}

.aesthetic-ol {
  list-style: none;
  counter-reset: algo-counter;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.aesthetic-ol > li {
  counter-increment: algo-counter;
  position: relative;
  padding-left: 36px;
  color: #cbd5e1;
  font-size: 0.96rem;
  line-height: 1.6;
}

.aesthetic-ol > li::before {
  content: counter(algo-counter);
  position: absolute;
  left: 0;
  top: 1px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(99, 102, 241, 0.2);
  border: 1px solid rgba(99, 102, 241, 0.4);
  color: #a5b4fc;
  font-size: 0.78rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-code);
}

.aesthetic-ol ul {
  list-style-type: lower-alpha;
  margin-left: 20px;
  margin-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.aesthetic-ol ul li {
  color: #94a3b8;
  font-size: 0.92rem;
}

/* 3. Program / Code */
.code-window {
  background: var(--code-bg);
  border: 1px solid rgba(148, 163, 184, 0.15);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

.window-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  background: rgba(255, 255, 255, 0.03);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.window-dots {
  display: flex;
  gap: 7px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.dot.red { background-color: #ef4444; }
.dot.yellow { background-color: #f59e0b; }
.dot.green { background-color: #10b981; }

.window-title {
  font-family: var(--font-code);
  font-size: 0.8rem;
  color: var(--text-dim);
}

.code-window pre {
  margin: 0;
  padding: 22px 24px;
  overflow-x: auto;
  line-height: 1.6;
}

.code-window code {
  font-family: var(--font-code);
  font-size: 0.9rem;
  color: #e2e8f0;
  tab-size: 4;
}

/* Keyframes & Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.99); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse-glow {
  0% { box-shadow: 0 0 10px rgba(99, 102, 241, 0.4); }
  100% { box-shadow: 0 0 22px rgba(168, 85, 247, 0.7); }
}

/* Stagger animations for cards */
.option-card:nth-child(1) { animation: slideUp 0.3s ease-out 0.05s both; }
.option-card:nth-child(2) { animation: slideUp 0.3s ease-out 0.10s both; }
.option-card:nth-child(3) { animation: slideUp 0.3s ease-out 0.15s both; }
.option-card:nth-child(4) { animation: slideUp 0.3s ease-out 0.20s both; }
.option-card:nth-child(5) { animation: slideUp 0.3s ease-out 0.25s both; }
.option-card:nth-child(6) { animation: slideUp 0.3s ease-out 0.30s both; }
.option-card:nth-child(7) { animation: slideUp 0.3s ease-out 0.35s both; }
.option-card:nth-child(8) { animation: slideUp 0.3s ease-out 0.40s both; }
.option-card:nth-child(9) { animation: slideUp 0.3s ease-out 0.45s both; }

/* Responsive */
@media (max-width: 960px) {
  .options-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .hero-title {
    font-size: 2.2rem;
  }
}

@media (max-width: 640px) {
  .options-grid {
    grid-template-columns: 1fr;
  }
  .hero-title {
    font-size: 1.8rem;
  }
  .top-bar {
    flex-direction: column;
    gap: 16px;
    align-items: flex-start;
  }
  .quick-nav-pills {
    width: 100%;
    justify-content: space-between;
  }
  .answer-body {
    padding: 16px;
  }
}

  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="site-wrapper">
    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <div class="brand-badge" onclick="showSelectorView()">
        <div class="brand-icon">DS</div>
        <div class="brand-text">
          <h1>Data Structures Lab</h1>
          <span>Interactive Solutions</span>
        </div>
      </div>
      <div class="quick-nav-pills" id="quick-nav-pills">
        <!-- Quick pills 1 to 9 injected here -->
      </div>
    </header>

    <!-- VIEW 1: HERO & QUESTION SELECTOR (1 to 9 Options) -->
    <main class="view-selector" id="view-selector">
      <section class="hero-section">
        <div class="hero-pill">
          <span class="hero-pill-dot"></span>
          <span>SELECT AN EXPERIMENT</span>
        </div>
        <h2 class="hero-title">
          Which question do you want <br><span class="gradient-text">the answer for?</span>
        </h2>
        <p class="hero-subtitle">
          Choose any option from 1 to 9 below. Click to instantly reveal the complete question, algorithm, and C program.
        </p>
      </section>

      <!-- 1 to 9 Option Cards -->
      <div class="options-grid" id="options-grid">
        <!-- Injected by JavaScript -->
      </div>
    </main>

    <!-- VIEW 2: ANSWER DETAIL VIEW -->
    <section class="view-detail" id="view-detail">
      <div id="detail-content">
        <!-- Active Question, Algorithm, and Program Injected Here -->
      </div>
    </section>
  </div>

  <script>
const experimentsData = [
  {
    "id": "exp-1",
    "num": 1,
    "title": "Experiment 1: Arrays",
    "shortName": "Arrays",
    "desc": "Fixed-size array operations & vehicle number plate format validator",
    "subquestions": [
      {
        "number": "1. a.",
        "title": "1. a.",
        "subtitle": "Array of Fixed Dimension (Insertion & Display)",
        "question": "1. a. Write a C program to implement an array of fixed dimension. Perform the following operations: inserting elements into an array and displaying the contents of the array. (User enters the size of the array.)",
        "algorithm": [
          "Start the program.",
          "Declare integer variable n to store the size of the array.",
          "Prompt the user to enter the size of the array and read the value into n.",
          "Declare an integer array arr of size n.",
          "Prompt the user to enter n values to store in the array.",
          "Iterate from i = 0 to n - 1 and read each value into arr[i] using scanf.",
          "Display the stored elements by iterating from i = 0 to n - 1 and printing each arr[i].",
          "Return 0 and stop."
        ],
        "code": "#include <stdio.h>\n\nint main() {\n    int n;\n    printf(\"Enter the size of the array:\");\n    scanf(\"%d\", &n);\n\n    int arr[n];\n\n    printf(\"Enter the %d values to store it in array: \\n\", n);\n    for (int i = 0; i < n; i++)\n    {\n        scanf(\"%d\", &arr[i]);\n    }\n\n    printf(\"The values stored in the array are: \\n\");\n    for (int i = 0; i < n; i++)\n    {\n        printf(\"%d \\n\", arr[i]);\n    }\n\n    return 0;\n}"
      },
      {
        "number": "1. b.",
        "title": "1. b.",
        "subtitle": "Vehicle Number Plate Validator",
        "question": "1. b. Evaluate the Number Plates of Vehicles. Write a C program to insert a vehicle registration number into a 1x10 array and validate it against the format: 2 letters (state code) + 2 digits (district code) + 2 letters (RTO serial) + 4 digits (vehicle number), e.g. KA09MN3865. Print \"Accept\" if valid, else \"Reject\".\n\nRules to check:\ni. First two positions of an array must be a State Code.\nii. Next two positions of an array must be District Code.\niii. Next two Positions of an array must be a Serial Number of an RTO.\niv. The penultimate position of the array must contain a vehicle number.",
        "algorithm": [
          "Start the program.",
          "Define a function verifyRegistration(registration) returning boolean:",
          [
            "Check if the length of the string is exactly 10 using strlen(). If not, return false.",
            "Verify indices 0 and 1 are alphabets using isalpha(). If not, return false.",
            "Verify indices 2 and 3 are digits using isdigit(). If not, return false.",
            "Verify indices 4 and 5 are alphabets using isalpha(). If not, return false.",
            "Verify indices 6 through 9 are digits using isdigit(). If not, return false.",
            "If all checks pass, return true."
          ],
          "In main():",
          [
            "Declare character array registration of size 11.",
            "Prompt user and read vehicle registration string.",
            "Call verifyRegistration(registration).",
            "If true, print \"Accept: Vehicle registration number is valid.\\n\".",
            "If false, print \"Reject: Vehicle registration number is invalid.\\n\"."
          ],

// Helper: escape HTML
function escapeHTML(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Helper: format question text preserving paragraphs and samples
function formatQuestionText(text) {
  if (text.includes("Sample Input:")) {
    const parts = text.split("Sample Input:");
    const mainPart = escapeHTML(parts[0].trim()).replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
    const samplePart = escapeHTML(parts[1].trim());
    return `<p>${mainPart}</p><div class="sample-input-box">Sample Input:\n${samplePart}</div>`;
  }
  return `<p>${escapeHTML(text).replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>")}</p>`;
}

// Helper: format numbered algorithm
function formatAlgorithm(steps) {
  let html = `<ol class="aesthetic-ol">`;
  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    if (Array.isArray(step)) {
      html += `<ul>`;
      for (const substep of step) {
        html += `<li>${escapeHTML(substep)}</li>`;
      }
      html += `</ul>`;
    } else {
      if (i + 1 < steps.length && Array.isArray(steps[i + 1])) {
        html += `<li>${escapeHTML(step)}<ul>`;
        for (const substep of steps[i + 1]) {
          html += `<li>${escapeHTML(substep)}</li>`;
        }
        html += `</ul></li>`;
        i++;
      } else {
        html += `<li>${escapeHTML(step)}</li>`;
      }
    }
  }
  html += `</ol>`;
  return html;
}

// Switch View: Show Option Selector Screen
function showSelectorView() {
  document.getElementById("view-selector").style.display = "block";
  document.getElementById("view-detail").style.display = "none";
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Update quick pills
  document.querySelectorAll(".quick-pill").forEach(p => p.classList.remove("active"));
}

// Switch View: Show Specific Question Answer
function showDetailView(expId) {
  const exp = experimentsData.find(e => e.id === expId);
  if (!exp) return;

  const container = document.getElementById("detail-content");
  
  let html = `
    <div class="detail-header">
      <div class="detail-title-group">
        <h2>${escapeHTML(exp.title)}</h2>
        <p>${escapeHTML(exp.desc)}</p>
      </div>
      <button class="back-btn" onclick="showSelectorView()">
        <span>←</span> Choose Another Question
      </button>
    </div>
  `;

  exp.subquestions.forEach((subq) => {
    html += `
      <article class="answer-card">
        <header class="answer-header">
          <div class="answer-header-title">
            <span class="badge-subquestion">${escapeHTML(subq.number)}</span>
            <h3>${escapeHTML(subq.subtitle || subq.title)}</h3>
          </div>
        </header>

        <div class="answer-body">
          <!-- 1. QUESTION / PROBLEM STATEMENT -->
          <div class="content-section">
            <h4 class="section-tag">1. QUESTION / PROBLEM STATEMENT</h4>
            <div class="question-box">
              ${formatQuestionText(subq.question)}
            </div>
          </div>

          <!-- 2. ALGORITHM -->
          <div class="content-section">
            <h4 class="section-tag">2. ALGORITHM</h4>
            <div class="algorithm-box">
              ${formatAlgorithm(subq.algorithm)}
            </div>
          </div>

          <!-- 3. PROGRAM / CODE -->
          <div class="content-section">
            <h4 class="section-tag">3. PROGRAM / CODE</h4>
            <div class="code-window">
              <div class="window-bar">
                <div class="window-dots">
                  <span class="dot red"></span>
                  <span class="dot yellow"></span>
                  <span class="dot green"></span>
                </div>
                <span class="window-title">${escapeHTML(exp.shortName.toLowerCase().replace(/\s+/g, '_'))}_${subq.number.replace(/[^a-z0-9]/gi, '')}.c</span>
              </div>
              <pre><code class="language-c">${escapeHTML(subq.code)}</code></pre>
            </div>
          </div>
        </div>
      </article>
    `;
  });

  container.innerHTML = html;

  document.getElementById("view-selector").style.display = "none";
  document.getElementById("view-detail").style.display = "block";
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // Update quick pills
  document.querySelectorAll(".quick-pill").forEach(p => {
    if (p.dataset.id === expId) {
      p.classList.add("active");
    } else {
      p.classList.remove("active");
    }
  });
}

// Build Options Grid (1 to 9) and Quick Pills
function buildApp() {
  const gridContainer = document.getElementById("options-grid");
  const quickPillsContainer = document.getElementById("quick-nav-pills");

  gridContainer.innerHTML = "";
  quickPillsContainer.innerHTML = "";

  experimentsData.forEach(exp => {
    // 1. Create Option Card in Grid
    const card = document.createElement("div");
    card.className = "option-card";
    card.onclick = () => showDetailView(exp.id);

    const tagsHtml = exp.subquestions
      .map(sq => `<span class="sub-tag">${escapeHTML(sq.number)}</span>`)
      .join("");

    card.innerHTML = `
      <div>
        <div class="card-top">
          <span class="card-num-badge">0${exp.num}</span>
          <span class="card-arrow">→</span>
        </div>
        <h3 class="card-title">${escapeHTML(exp.shortName)}</h3>
        <p class="card-desc">${escapeHTML(exp.desc)}</p>
      </div>
      <div class="card-footer-tags">
        ${tagsHtml}
      </div>
    `;
    gridContainer.appendChild(card);

    // 2. Create Quick Pill in Header
    const pill = document.createElement("button");
    pill.className = "quick-pill";
    pill.dataset.id = exp.id;
    pill.textContent = exp.num;
    pill.title = exp.title;
    pill.onclick = () => showDetailView(exp.id);
    quickPillsContainer.appendChild(pill);
  });
}

document.addEventListener("DOMContentLoaded", buildApp);
